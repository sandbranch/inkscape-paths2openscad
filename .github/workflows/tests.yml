name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # OpenSCAD renders the generated .scad files to STL for the size,
      # height and hole checks
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad
      # inkex without PyGObject, which only its GUI helpers need
      - run: pip install --no-deps inkex==1.4.0
      - run: pip install "lxml>=4.5,<7" numpy pillow pytest tinycss2 cssselect pyparsing packaging
      - run: python -W error::SyntaxWarning -m pytest -q tests/
        env:
          REQUIRE_OPENSCAD: "1"
